name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.2
      - run: ruff check .

  smoke:
    name: import + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # No spaCy model download here: `--help` and the module imports must work
      # without it. A full run needs `python -m spacy download uk_core_news_lg`.
      - run: python main.py --help
      - run: python -c "import phrase_analysis, phrase_analysis.pipeline"
