line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003 flag Cyrillic letters as "ambiguous" look-alikes of Latin ones.
# This project is about Ukrainian text, so those are false positives by design.
ignore = ["RUF001", "RUF002", "RUF003"]
